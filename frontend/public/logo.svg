<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="crestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Badge -->
  <path d="M50 8 L85 22 V50 C85 72 69 88 50 94 C31 88 15 72 15 50 V22 Z" fill="url(#crestGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Shield -->
  <path d="M50 14 L80 26 V49 C80 68 66 82 50 88 C34 82 20 68 20 49 V26 Z" fill="url(#shieldBg)" />
  
  <!-- Open Book Symbol -->
  <path d="M30 58 Q40 55 50 60 Q60 55 70 58 V42 Q60 39 50 44 Q40 39 30 42 Z" fill="#6366f1" />
  
  <!-- Sun / Sparkle Above Book -->
  <circle cx="50" cy="30" r="5" fill="#f59e0b" />
  <path d="M50 20 V23 M50 37 V40 M39 30 H42 M58 30 H61" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Happy Star Left/Right -->
  <circle cx="36" cy="33" r="2.5" fill="#f43f5e"/>
  <circle cx="64" cy="33" r="2.5" fill="#10b981"/>
</svg>
